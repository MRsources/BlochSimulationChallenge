# Runs when a pull request changes anything under submissions/.
# The checker scripts are the tip of main when the job starts. A pull
# request cannot replace them, and a later run picks up a checker that
# landed on main after the pull request opened. A passing pull request
# is merged into main as it stands, including one from a fork. Evaluation
# assigns the id on the eval branch. Merge eval back into main by hand.
# A failed check copies the unevaluated folder onto
# faulty-submissions and closes the pull request. A corrected submission
# is a new pull request.
# bot/issue-* is a validated issue. Those files were already checked, so
# this job does not check that pull request again. The owner merges it
# into main. Evaluation assigns the id on the eval branch. Merge eval
# back into main by hand.
name: Check submission pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'submissions/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: submission-id
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !startsWith(github.head_ref, 'bot/') && github.base_ref != 'submissions' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          path: pr
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout the trusted scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: base
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install numpy h5py
      - name: Validate
        env:
          # secrets.GITHUB_TOKEN is automatic. It is not a personal access token.
          # gh reads GH_TOKEN when a failed check is closed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DIR: ${{ github.workspace }}/pr
          BASE_DIR: ${{ github.workspace }}/base
          BASE_REF: ${{ github.base_ref }}
        run: python base/.github/scripts/comment_on_pr.py
